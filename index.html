<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>七年级中文大富翁 (18格精简版)</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --warning-color: #f1c40f;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
        }

        body {
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 2px solid #ddd;
        }

        .header {
            background: var(--primary-color);
            color: white;
            padding: 15px;
            text-align: center;
        }

        .header h1 { margin: 0; font-size: 1.4em; }
        .header p { margin: 3px 0 0; opacity: 0.9; font-size: 0.9em; }

        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 12px 20px;
            background: #eef2f7;
            border-bottom: 1px solid #ddd;
            font-weight: bold;
        }

        /* 18格简易棋盘可视化预览条 */
        .board-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 10px;
            background: #e2e8f0;
            justify-content: center;
        }
        .board-cell-mini {
            width: 30px;
            height: 30px;
            background: #fff;
            font-size: 0.7em;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
            font-weight: bold;
        }
        .cell-go { background: #ffebee !important; color: #c62828; }
        .cell-reward { background: #e8f5e9 !important; color: #2e7d32; }
        .cell-punish { background: #fce4ec !important; color: #c2185b; }
        .cell-stop { background: #fff3e0 !important; color: #e65100; }
        .cell-chance { background: #ede7f6 !important; color: #512da8; }
        .cell-active { border: 2px solid #e74c3c !important; transform: scale(1.1); }

        .game-area {
            padding: 20px;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .dice-display {
            font-size: 3em;
            margin-bottom: 10px;
            animation: bounce 0.5s infinite alternate;
            display: none;
        }

        .event-card {
            width: 100%;
            border: 2px dashed #ccc;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            background: #fafafa;
        }

        .event-type-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            color: white;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .type-grammar { background-color: #3498db; } 
        .type-dialog { background-color: #e91e63; } 
        .type-chance { background-color: #f39c12; } 
        .type-reward { background-color: #2ecc71; }
        .type-punish { background-color: #e74c3c; }
        .type-stop { background-color: #e65100; }

        .question-text {
            font-size: 1.1em;
            margin-bottom: 10px;
            white-space: pre-wrap; 
        }
        
        .options-grid {
            display: grid;
            gap: 10px;
            width: 100%;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: transform 0.1s, background 0.2s;
            width: 100%;
        }

        .btn:active { transform: scale(0.98); }
        .btn-primary { background: var(--primary-color); color: white; font-weight: bold; font-size: 1.1em; }
        .btn-option { background: #f8f9fa; border: 2px solid #e9ecef; color: #333; text-align: left; }
        .btn-option:hover { background: #e9ecef; }
        
        .feedback-area {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            display: none;
        }

        .correct { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .incorrect { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .hidden { display: none; }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🎓 七年级中文大富翁 (18格精简版)</h1>
        <p>7个功能格 + 11个题目录入格</p>
    </div>

    <!-- 18格棋盘可视化简图 -->
    <div class="board-preview" id="board-preview"></div>

    <div class="status-bar">
        <span>📍 当前位置: <span id="location-name">起点 (GO)</span></span>
        <span>💰 金币: <span id="gold-display">1000</span></span>
    </div>

    <div class="game-area" id="game-area">
        <div id="start-screen">
            <h2>欢迎来到中文课堂游戏！</h2>
            <p>本局共有 18 个格子，包含各类题目录入格与趣味功能格。</p>
            <br>
            <button class="btn btn-primary" onclick="startGame()">开始游戏 (Start)</button>
        </div>

        <div id="dice-screen" class="hidden">
            <div id="dice-anim" class="dice-display">🎲</div>
            <p id="move-text">轮到你了，点击按钮掷骰子！</p>
            <button class="btn btn-primary" id="roll-btn" onclick="rollDice()">掷骰子 (Roll Dice)</button>
        </div>

        <div id="question-screen" class="hidden">
            <div id="event-badge" class="event-type-badge"></div>
            <div class="event-card">
                <div id="q-hanzi" class="question-text"></div>
                <div id="options-container" class="options-grid"></div>
            </div>
            <div id="feedback" class="feedback-area"></div>
            <button id="next-btn" class="btn btn-primary hidden" onclick="returnToDice()">继续游戏 (Continue)</button>
        </div>
        
        <div id="special-screen" class="hidden">
            <div id="special-badge" class="event-type-badge"></div>
            <div class="event-card">
                <p id="special-msg" class="question-text"></p>
            </div>
            <button class="btn btn-primary" onclick="returnToDice()">确定 (OK)</button>
        </div>
    </div>
</div>

<script>
    // --- 18格棋盘定义 (包含 7 个功能格和 11 个题目录入格) ---
    // 类型说明: 'go'=起点, 'q'=题目录入格, 'reward'=奖励格, 'punish'=惩罚格, 'stop'=暂停格, 'chance'=机会格
    const board = [
        { id: 0, type: 'go', name: '起点 (GO)' },
        { id: 1, type: 'q', name: '题目录入格 1' },
        { id: 2, type: 'q', name: '题目录入格 2' },
        { id: 3, type: 'reward', name: '奖励格 (Reward)' },       // 功能格1
        { id: 4, type: 'q', name: '题目录入格 3' },
        { id: 5, type: 'q', name: '题目录入格 4' },
        { id: 6, type: 'stop', name: '暂停格 (Stop)' },           // 功能格2
        { id: 7, type: 'q', name: '题目录入格 5' },
        { id: 8, type: 'punish', name: '惩罚格 (Punish)' },       // 功能格3
        { id: 9, type: 'chance', name: '机会格 (Chance)' },       // 功能格4
        { id: 10, type: 'q', name: '题目录入格 6' },
        { id: 11, type: 'reward', name: '奖励格 (Reward)' },      // 功能格5
        { id: 12, type: 'q', name: '题目录入格 7' },
        { id: 13, type: 'q', name: '题目录入格 8' },
        { id: 14, type: 'stop', name: '暂停格 (Stop)' },          // 功能格6
        { id: 15, type: 'q', name: '题目录入格 9' },
        { id: 16, type: 'q', name: '题目录入格 10' },
        { id: 17, type: 'chance', name: '机会格 (Chance)' }       // 功能格7
    ];

    // --- 题库数据 (适用于 11 个题目录入格) ---
    const questionDb = [
        {"Q":"他是哈迪( )？\nTā shì Hādí ( )?", "Opts":["A. 吗 (ma)","B. 不 (bù)","C. 很 (hěn)"], "Ans":"A", "type":"grammar"},
        {"Q":"( )不是纳达。\n( ) bú shì Nádá.", "Opts":["A. 吗 (ma)","B. 她 (tā)","C. 什么 (shénme)"], "Ans":"B", "type":"grammar"},
        {"Q":"我( )笔。\nWǒ ( ) bǐ.", "Opts":["A. 吗 (ma)","B. 有 (yǒu)","C. 是 (shì)"], "Ans":"B", "type":"grammar"},
        {"Q":"他有( )吗？\nTā yǒu ( ) ma?", "Opts":["A. 笔 (bǐ)","B. 吗 (ma)","C. 谁 (shéi)"], "Ans":"A", "type":"grammar"},
        {"Q":"我有笔，( )你。\nWǒ yǒu bǐ, ( ) nǐ.", "Opts":["A. 给 (gěi)","B. 和 (hé)","C. 去 (qù)"], "Ans":"A", "type":"grammar"},
        {"Q":"他们去( )。\nTāmen qù ( ).", "Opts":["A. 公园 (gōngyuán)","B. 吗 (ma)","C. 谁 (shéi)"], "Ans":"A", "type":"grammar"},
        {"Q":"A: 他是阿里吗？\nA: Tā shì Ālǐ ma?", "Opts":["A. 是，他是阿里。","B. 他不是书。","C. 我没有。"], "Ans":"A", "type":"dialog"},
        {"Q":"A: 你有笔吗？\nA: Nǐ yǒu bǐ ma?", "Opts":["A. 他是。","B. 我没有。","C. 再见。"], "Ans":"B", "type":"dialog"},
        {"Q":"A: 这是你的书吗？\nA: Zhè shì nǐ de shū ma?", "Opts":["A. 谢谢。","B. 不是，这是我的。","C. 是，这是我的书。"], "Ans":"C", "type":"dialog"},
        {"Q":"A: 你们去哪儿？\nA: Nǐmen qù nǎr?", "Opts":["A. 我们去公园。","B. 我是学生。","C. 他很高兴。"], "Ans":"A", "type":"dialog"},
        {"Q":"A: 今天星期几？\nA: Jīntiān xīngqī jǐ?", "Opts":["A. 今天星期三。","B. 我不去。","C. 我有中文课。"], "Ans":"A", "type":"dialog"}
    ];

    let currentPos = 0;
    let gold = 1000;
    let currentQuestion = null;

    // 初始化渲染棋盘预览条
    function renderBoardPreview() {
        const preview = document.getElementById('board-preview');
        preview.innerHTML = '';
        board.forEach((cell, idx) => {
            const div = document.createElement('div');
            div.className = `board-cell-mini cell-${cell.type}`;
            div.id = `mini-cell-${idx}`;
            div.innerText = idx;
            div.title = cell.name;
            preview.appendChild(div);
        });
        updateBoardHighlight();
    }

    function updateBoardHighlight() {
        document.querySelectorAll('.board-cell-mini').forEach(el => el.classList.remove('cell-active'));
        const activeEl = document.getElementById(`mini-cell-${currentPos}`);
        if (activeEl) activeEl.classList.add('cell-active');
    }

    function startGame() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('dice-screen').classList.remove('hidden');
        renderBoardPreview();
    }

    function rollDice() {
        const btn = document.getElementById('roll-btn');
        const anim = document.getElementById('dice-anim');
        const text = document.getElementById('move-text');
        
        btn.disabled = true;
        anim.style.display = 'block';
        text.innerText = "正在掷骰子...";

        setTimeout(() => {
            const steps = Math.floor(Math.random() * 6) + 1;
            anim.style.display = 'none';
            text.innerText = `🎲 掷出了 ${steps} 点！`;
            
            // 移动步数 (总共18格，取模循环)
            currentPos = (currentPos + steps) % 18;
            document.getElementById('location-name').innerText = `${currentPos}. ${board[currentPos].name}`;
            updateBoardHighlight();

            setTimeout(() => {
                handleCellEvent(board[currentPos]);
                btn.disabled = false;
            }, 1000);
        }, 800);
    }

    function handleCellEvent(cell) {
        document.getElementById('dice-screen').classList.add('hidden');

        if (cell.type === 'q') {
            // 题目录入格：随机抽取一道题
            setupQuestion();
        } else {
            // 功能格 (7个中的其他类型)
            setupSpecialCell(cell);
        }
    }

    function setupQuestion() {
        document.getElementById('question-screen').classList.remove('hidden');
        document.getElementById('feedback').style.display = 'none';
        document.getElementById('next-btn').classList.add('hidden');
        
        const badge = document.getElementById('event-badge');
        const container = document.getElementById('options-container');
        container.innerHTML = '';

        // 随机取题
        currentQuestion = questionDb[Math.floor(Math.random() * questionDb.length)];

        if (currentQuestion.type === 'grammar') {
            badge.className = 'event-type-badge type-grammar';
            badge.innerText = '📘 题目录入格 - 语法站';
        } else {
            badge.className = 'event-type-badge type-dialog';
            badge.innerText = '💬 题目录入格 - 交际角';
        }

        document.getElementById('q-hanzi').innerText = currentQuestion.Q;

        currentQuestion.Opts.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn btn-option';
            btn.innerText = opt;
            const letter = opt.charAt(0);
            btn.onclick = () => checkAnswer(letter, btn);
            container.appendChild(btn);
        });
    }

    function checkAnswer(selection, btnElement) {
        document.querySelectorAll('.btn-option').forEach(b => b.disabled = true);
        const feedback = document.getElementById('feedback');
        feedback.style.display = 'block';
        document.getElementById('next-btn').classList.remove('hidden');

        if (selection === currentQuestion.Ans) {
            gold += 200;
            feedback.className = 'feedback-area correct';
            feedback.innerHTML = `<strong>✅ 回答正确！(Correct!)</strong><br>太棒了！奖励 200 金币。`;
            btnElement.style.background = '#d4edda';
        } else {
            gold -= 100;
            if (gold < 0) gold = 0;
            feedback.className = 'feedback-area incorrect';
            feedback.innerHTML = `<strong>❌ 回答错误。(Incorrect)</strong><br>正确答案是: ${currentQuestion.Ans}<br>扣除 100 金币。`;
            btnElement.style.background = '#f8d7da';
        }
        updateGold();
    }

    function setupSpecialCell(cell) {
        document.getElementById('special-screen').classList.remove('hidden');
        const badge = document.getElementById('special-badge');
        const msg = document.getElementById('special-msg');

        if (cell.type === 'go') {
            badge.className = 'event-type-badge type-grammar';
            badge.innerText = '🚀 起点格 (GO)';
            msg.innerText = "经过起点，获得额外补给！\n(+300 金币)";
            gold += 300;
        } else if (cell.type === 'reward') {
            badge.className = 'event-type-badge type-reward';
            badge.innerText = '🎁 奖励格 (Reward)';
            msg.innerText = "运气真好！获得中文学习奖励积分。\n(+200 金币)";
            gold += 200;
        } else if (cell.type === 'punish') {
            badge.className = 'event-type-badge type-punish';
            badge.innerText = '⚡ 惩罚格 (Punish)';
            msg.innerText = "遭遇小考验，扣除部分积分。\n(-150 金币)";
            gold -= 150;
            if (gold < 0) gold = 0;
        } else if (cell.type === 'stop') {
            badge.className = 'event-type-badge type-stop';
            badge.innerText = '🛑 暂停格 (Stop)';
            msg.innerText = "稍作休息，本回合暂停一次答题。";
        } else if (cell.type === 'chance') {
            badge.className = 'event-type-badge type-chance';
            badge.innerText = '🎲 机会格 (Chance)';
            msg.innerText = "获得一次额外掷骰子的好运！\n(+100 金币)";
            gold += 100;
        }
        updateGold();
    }

    function updateGold() {
        document.getElementById('gold-display').innerText = gold;
    }

    function returnToDice() {
        document.getElementById('question-screen').classList.add('hidden');
        document.getElementById('special-screen').classList.add('hidden');
        document.getElementById('dice-screen').classList.remove('hidden');
        document.getElementById('move-text').innerText = "轮到你了，点击按钮掷骰子！";
    }
</script>
</body>
</html>
